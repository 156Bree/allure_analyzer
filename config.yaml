# =============================================================================
# 分析龙虾 (Allure Report Analyzer) 配置文件
# -----------------------------------------------------------------------------
# 换一份新报告时，通常只需改这里，无需改代码。
# 若未安装 PyYAML，工具会自动回落到代码内置的等价默认值（analyzer/config.py）。
# =============================================================================

# --- case key 抽取 -----------------------------------------------------------
# 抽取优先级：按顺序尝试，命中即停。可选来源：suite / subSuite / links.url / fullName
case_key:
  order: [suite, subSuite, links.url]
  # 形如 LIP-690 / lip_690 / lip 690 都能识别，归一化为 LIP-<数字>
  regex: '[Ll][Ii][Pp][-_ ]?(\d+)'
  normalized_prefix: "LIP-"
  unlinked_label: "UNLINKED"

# --- Jira 链接 ----------------------------------------------------------------
jira:
  browse_base: "https://jira.tc.lenovo.com/browse/"

# --- owner 识别 ---------------------------------------------------------------
# whitelist：已知 owner 名（强纳入）。
# whitelist_only=true 时，只认 whitelist 内的名字为 owner（最稳，绝不臆造 owner）。
# whitelist_only=false 时，额外启用启发式：满足 owner_name_rule 且不在排除集的 tag 也算 owner。
owner:
  whitelist: [Steven, Marcus, Qingting, Judy]
  whitelist_only: true
  blacklist: []
  no_owner_label: "(no-owner)"
  # 启发式人名规则（仅 whitelist_only=false 时生效）
  name_rule:
    require_first_upper: true     # 首字母大写
    alpha_only: true              # 纯字母（无数字/下划线）
    min_len: 3
    max_len: 12

# --- component（功能模块）维度 ----------------------------------------------
# 来源字段：parentSuite label（每条记录恰好 1 个）。
# parent_suite_map：parentSuite 取值 -> 对外 component 显示名。
# 未在映射表内的 parentSuite -> (no-component)，绝不臆造。
component:
  source: parentSuite
  parent_suite_map:
    tests.test_hw_insight: "UDC plugin HW Insight"
    tests.test_app_insight: "UDC Plugin -APP Insight"
  no_component_label: "(no-component)"

# --- device / 机器维度 -------------------------------------------------------
# 机器维度一律用 host label。设备型号 tag 是“目标设备清单”(一条挂多个)，不可用作机器维度。
device:
  # 设备型号 tag 的识别正则（用于从 owner 候选里排除），命中即视为设备型号而非人名
  model_regex: '(_|[0-9])'
  # host -> 展示名 美化映射；未配置的 host 原样显示（不臆造名称）
  display_map: {}
    # 示例：
    # YogaP7-4165: "Yoga Pro 7 (4165)"

# --- 状态口径 ----------------------------------------------------------------
status:
  passed_values: [passed]
  # not_passed = failed + broken；对外状态列只显示 Pass / Fail（broken 计入 Fail）
  fail_values: [failed, broken, unknown, skipped]

# --- 阈值与 TopN -------------------------------------------------------------
thresholds:
  pass_rate_good: 0.90    # >= 绿
  pass_rate_warn: 0.70    # >= 黄，否则红
top_n: 10
